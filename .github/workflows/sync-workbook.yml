name: Sync rental workbook
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rental-workbook-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 defusedxml==0.7.1
      - name: Read source and update the private CRM
        run: python automation/sync_workbook.py
        env:
          GOOGLE_WORKBOOK_ID: ${{ secrets.GOOGLE_WORKBOOK_ID }}
          CRM_SYNC_SECRET: ${{ secrets.CRM_SYNC_SECRET }}
          CRM_SUPABASE_URL: https://qhfwjgqigcnmikzmmoin.supabase.co
          CRM_PUBLIC_KEY: sb_publishable_Ao26uKGHJyESgeyOoCarNg_3G3j8oHH

